name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile the helper script
        run: python -m compileall scripts

      - name: Show CLI help
        run: python scripts/proxmox_vm.py --help

      - name: Show sample script help
        run: |
          python scripts/examples/cluster_probe.py --help
          python scripts/examples/guest_snapshot.py --help

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Build docs
        run: npm run docs:build --prefix docs
